# Redis Clone Configuration

# Server settings
resp-port: 6379
http-port: 8080
auth-token: ""  # Set this for HTTP API authentication

# Persistence settings
rdb-enabled: true
rdb-path: "dump.rdb"
aof-enabled: true
aof-path: "appendonly.aof"

# Logging settings
log:
  level: "info"  # debug, info, warn, error 